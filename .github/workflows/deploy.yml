name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-dotnet:
    name: Build .NET WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build .NET WebAssembly runtime
        run: |
          cd csharp/YarnSpinnerJS
          dotnet build -c Release

      - name: Upload _framework artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-framework
          path: csharp/YarnSpinnerJS/bin/Release/net10.0/wwwroot/_framework
          retention-days: 1

  build-frontend:
    name: Build Frontend
    needs: build-dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Download _framework artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-framework
          path: public/_framework

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=yarn-playground
